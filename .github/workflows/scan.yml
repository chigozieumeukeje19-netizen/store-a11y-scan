name: Scan stores
on:
  workflow_dispatch:
  push:
    paths: [stores.txt]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scan.js
      - name: Encrypt results
        env:
          RESULTS_KEY: ${{ secrets.RESULTS_KEY }}
        run: openssl enc -aes-256-cbc -pbkdf2 -salt -in results/latest.json -out results/latest.json.enc -pass env:RESULTS_KEY && rm results/latest.json
      - uses: actions/upload-artifact@v4
        with: { name: results, path: results/latest.json.enc, retention-days: 3 }
