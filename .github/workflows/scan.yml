name: Scan stores
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [stores.txt]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scan.js
      - name: Encrypt results with the public key
        run: |
          openssl rand -hex 32 > k
          openssl enc -aes-256-cbc -pbkdf2 -salt -in results/latest.json -out latest.json.enc -pass file:k
          openssl pkeyutl -encrypt -pubin -inkey results-public.pem -in k -out key.enc
          rm -f k results/latest.json
      - name: Publish encrypted results to the results branch
        run: |
          mkdir out && mv latest.json.enc key.enc out/ && cd out
          git init -q -b results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Encrypted scan results ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" results
